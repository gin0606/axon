name: Full verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-verification:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc g++ clang libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install
      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2.9.3
      - name: Run full verification
        run: scripts/full-verification
