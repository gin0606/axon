version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # GUI passes its markdown syntax tree to GPUI Base, so markdown must stay on
      # the version GPUI Base uses. Update it by hand together with gpui-kit.
      - dependency-name: markdown
