[package]
name = "axon-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[dependencies]
blake3 = "1.8.2"
chrono = { version = "0.4.45", features = ["serde"] }
granit-parser = "1.2.0"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "1.2.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
thiserror = "2.0.20"
