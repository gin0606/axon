[package]
name = "axon-label-conversion"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "One-time conversion of an axon-records/v1 store to the labelled axon-records/v2 format"
license = "MIT"
publish = false

[dependencies]
axon-core = { path = "../axon-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
