[package]
name = "axon-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop application for Axon built with GPUI"
license = "MIT"
publish = false

[dependencies]
axon = { path = "../.." }
chrono = "0.4.45"
dirs = "6.0.0"
gpui-kit = "=0.7.1"
rand = "0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
tempfile = "3.22.0"
