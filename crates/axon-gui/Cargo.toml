[package]
name = "axon-gui"
version = "0.5.1"
edition = "2024"
description = "Desktop application for Axon built with GPUI"
license = "MIT"
publish = false

[package.metadata.bundle]
name = "Axon"
identifier = "me.gin0606.axon"
icon = ["resources/app-icon.svg"]
category = "public.app-category.productivity"

[package.metadata.bundle.osx]
# `axon gui` opens a management root through this scheme; see `axon::app_link`.
url_schemes = ["me.gin0606.axon"]
info_plist_exts = ["resources/Info.plist"]

[dependencies]
axon = { path = "../.." }
chrono = "0.4.45"
dirs = "7.0.0"
gpui-kit = "=0.8.1"
markdown = "=1.0.0"
rust-i18n = "=4.2.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sys-locale = "=0.3.2"

[dev-dependencies]
gpui-kit = { version = "=0.8.1", features = ["test-support"] }
tempfile = "3.22.0"
