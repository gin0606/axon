[package]
name = "axon-gui"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop application for Axon built with GPUI"
license = "MIT"
publish = false

[package.metadata.bundle]
name = "Axon"
identifier = "me.gin0606.axon"
icon = ["resources/app-icon.svg"]
category = "public.app-category.productivity"

[package.metadata.bundle.osx]
# `axon gui` opens a management root through this scheme; see `axon::app_link`.
url_schemes = ["me.gin0606.axon"]

[dependencies]
axon = { path = "../.." }
chrono = "0.4.45"
dirs = "6.0.0"
gpui-kit = "=0.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui-kit = { version = "=0.7.1", features = ["test-support"] }
tempfile = "3.22.0"
