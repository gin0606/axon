[package]
name = "axon"
version = "0.1.0"
edition = "2024"
autotests = false
rust-version = "1.89"
description = "A local issue tracker with independent state axes"
license = "MIT"
repository = "https://github.com/gin0606/axon"
readme = "README.md"
publish = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
blake3 = "1.8.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.8"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "backup"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "1.2.0"
thiserror = "2.0.20"

[dev-dependencies]
libc = "0.2.189"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"
