[package]
name = "axon"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "A local issue tracker for Issues and Groups"
license = "MIT"
repository = "https://github.com/gin0606/axon"
readme = "README.md"
publish = false

[workspace]
members = ["crates/axon-core", "crates/axon-recorder"]
default-members = [".", "crates/axon-core", "crates/axon-recorder"]

[workspace.package]
rust-version = "1.89"

[dependencies]
axon-core = { path = "crates/axon-core" }
axon-recorder = { path = "crates/axon-recorder" }
blake3 = "1.8.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.8"
libc = "0.2.189"
rand = "0.10.2"
serde_json = { version = "1.0", features = ["arbitrary_precision", "float_roundtrip", "raw_value"] }
thiserror = "2.0.20"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
proptest = "1.11.0"
