[package]
name = "axon"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.2"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.8"
rand = "0.10.2"
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "1.2.0"
thiserror = "2.0.20"

[dev-dependencies]
libc = "0.2.189"
