pre-commit:
  parallel: true
  jobs:
    - name: fmt
      glob: "*.rs"
      run: mise exec -- cargo fmt --check
    - name: clippy
      glob: "*.rs"
      run: mise exec -- cargo clippy --all-targets --all-features -- -D warnings
    - name: test
      glob: "*.rs"
      run: mise exec -- cargo test --lib --bin axon --test smoke

post-checkout:
  jobs:
    - name: release-build
      run: test "{3}" != "1" || ./scripts/build-canonical-axon

post-commit:
  jobs:
    - name: release-build
      run: ./scripts/build-canonical-axon

post-merge:
  jobs:
    - name: release-build
      run: ./scripts/build-canonical-axon

post-rewrite:
  jobs:
    - name: release-build
      run: ./scripts/build-canonical-axon
