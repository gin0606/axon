pre-commit:
  parallel: true
  jobs:
    - name: plugin-versions
      run: python3 scripts/update-plugin-versions.py
    - name: fmt
      glob: "*.rs"
      run: mise exec -- cargo fmt --check
    - name: clippy
      glob: "*.rs"
      run: mise exec -- cargo clippy --all-targets --all-features -- -D warnings
    - name: test
      glob: "*.rs"
      run: mise exec -- cargo test --workspace --exclude axon-gui --lib --bin axon --test smoke

pre-push:
  follow: true
  jobs:
    - name: verify-main-push
      script: verify-main-push
      runner: sh
      use_stdin: true
