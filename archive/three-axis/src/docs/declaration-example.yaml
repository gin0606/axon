schema: axon-plan/v3
issues:
  - id: null
    key: implement
    base: null
    title: Implement the feature
    description: Deliver the planned behavior.
    observed:
      progress: not_started
      claim: null
      disposition: accepted
      resurface:
        kind: always
  - id: null
    key: verify
    base: null
    title: Verify the feature
    description: null
    observed:
      progress: not_started
      claim: null
      disposition: accepted
      resurface:
        kind: always
groups:
  - id: null
    key: feature
    base: null
    title: Deliver a feature
    description: Implement and verify the feature.
    observed:
      progress: not_started
      claim: null
      disposition: accepted
      resurface:
        kind: always
relations:
  editable:
    parents:
      - child: { key: implement }
        parent: { key: feature }
      - child: { key: verify }
        parent: { key: feature }
    dependencies:
      - dependent: { key: verify }
        prerequisite: { key: implement }
  readonly:
    parents: []
    dependencies: []
references:
  entities: []
